name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # nmap is intentionally NOT installed: tests must use fixtures only.
      - name: Install dev tools
        run: python -m pip install --upgrade pip ruff pytest
      - name: Ruff lint
        run: |
          ruff check .
          ruff format --check .
      - name: Pytest
        run: pytest
