name: Build

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: build (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Build binary
        run: packaging/build-binary.sh "${{ matrix.arch }}"

      - name: Build .deb
        run: packaging/build-deb.sh "${{ matrix.arch }}"

      - name: Smoke-test binary
        env:
          BIN: dist/homenet-linux-${{ matrix.arch }}
        run: |
          "$BIN" --version
          "$BIN" --help | grep -q "Only scan networks you own"
          "$BIN" explain devices --network 192.168.1.0/24 | grep -q "nmap"
          "$BIN" explain devices --network 192.168.1.0/24 --json > /dev/null

      - name: Smoke-test .deb
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          deb="$(ls dist/homenet_*_"$ARCH".deb)"
          info="$(dpkg-deb --info "$deb")"
          contents="$(dpkg-deb --contents "$deb")"
          echo "$info"
          grep -q "Depends: nmap, iproute2" <<<"$info"
          grep -q "Architecture: $ARCH" <<<"$info"
          grep -q "./usr/lib/homenet/install-method" <<<"$contents"
          grep -q "./usr/share/man/man1/homenet.1.gz" <<<"$contents"
          grep -Eq "^-rwxr-xr-x root/root .* ./usr/bin/homenet$" <<<"$contents"
          test "$(dpkg-deb --fsys-tarfile "$deb" | tar -xO ./usr/lib/homenet/install-method)" = "deb"
          if dpkg-deb --ctrl-tarfile "$deb" | tar -t | grep -Eq 'postinst|preinst|postrm|prerm'; then
            echo "unexpected maintainer script" >&2
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: homenet-linux-${{ matrix.arch }}
          path: |
            dist/homenet-linux-${{ matrix.arch }}
            dist/homenet_*_${{ matrix.arch }}.deb
          if-no-files-found: error
