[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "homenet-cli"
version = "0.2.0"
description = "Beginner-friendly CLI wrapping nmap for home network detection on Linux"
requires-python = ">=3.10"
authors = [{ name = "Gunnar Jackson" }]
dependencies = ["defusedxml>=0.7"]

[project.scripts]
homenet = "homenet.cli:main"

[project.optional-dependencies]
dev = [
  "pytest>=7",
  "ruff>=0.4",
  "tomli>=2.0.1; python_version < '3.11'",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S314"]
